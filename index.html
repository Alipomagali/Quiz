<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Quiz Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .flag-img {
            width: 200px;
            height: 120px;
            border-radius: 5px;
        }
        .option {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .option:hover {
            background: darkblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="flag" class="flag-img" src="" alt="Flag">
        <div id="options"></div>
        <p id="result"></p>
    </div>
    <script>
        const questions = [
            { flag: "https://flagcdn.com/w320/fr.png", options: ["France", "Germany", "Italy", "Spain"], answer: "France" },
            { flag: "https://flagcdn.com/w320/de.png", options: ["Belgium", "Netherlands", "Germany", "Austria"], answer: "Germany" },
            { flag: "https://flagcdn.com/w320/jp.png", options: ["South Korea", "Japan", "China", "Vietnam"], answer: "Japan" }
        ];
        
        let currentQuestion = 0;
        let score = 0;
        
        function loadQuestion() {
            if (currentQuestion < questions.length) {
                document.getElementById("flag").src = questions[currentQuestion].flag;
                document.getElementById("options").innerHTML = "";
                
                questions[currentQuestion].options.forEach(option => {
                    let button = document.createElement("button");
                    button.textContent = option;
                    button.classList.add("option");
                    button.onclick = () => checkAnswer(option);
                    document.getElementById("options").appendChild(button);
                });
            } else {
                document.querySelector(".container").innerHTML = `<h2>Game Over! Your score: ${score}/${questions.length}</h2>`;
            }
        }
        
        function checkAnswer(selectedOption) {
            if (selectedOption === questions[currentQuestion].answer) {
                score++;
            }
            currentQuestion++;
            loadQuestion();
        }
        
        loadQuestion();
    </script>
</body>
</html>
